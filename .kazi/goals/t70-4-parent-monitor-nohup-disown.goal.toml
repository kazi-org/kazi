id = "t70-4-parent-monitor-nohup-disown"
name = "T70.4 Fix #1699: distinguish an intentionally-detached (nohup/disown/setsid) launcher from a genuinely dead one in Kazi.Runtime.ParentMonitor"

[metadata]
issue = "https://github.com/kazi-org/kazi/issues/1699"
epic = "E70"

[[predicate]]
id = "cap-detach-vs-dead"
provider = "custom_script"
description = "TASK BRIEF (github #1699, kazi-org/kazi E70 T70.4, DECIDED 2026-08-30: fix the check). `Kazi.Runtime.ParentMonitor` (lib/kazi/runtime/parent_monitor.ex, built for #1073) records the launcher's pid ONCE at init (`resolve_launcher_pid/0`, `ps -o ppid=`) and polls its liveness via `alive_fn` (default `Kazi.Harness.ChildSupervisor.alive?/1`); after `dead_threshold` consecutive dead reads it calls `on_dead` (default: log + `Finalizer.record_termination/2` + `System.halt(0)`, see `default_on_dead/1`). BUG: `kazi apply --parallel`, launched via `nohup ... & disown` (or `setsid`) so it deliberately reparents off its invoking shell, gets reaped within ~26s as \"launcher process 1 is gone\" before any dispatch happens -- the module cannot currently tell 'reparented to init because the operator intentionally detached us' apart from 'the launcher actually died'. FIX: give `ParentMonitor` (or `resolve_launcher_pid/0`, or the poll path) a way to distinguish these two cases -- e.g. detect that the current parent is genuinely pid 1 (init) in a way consistent with an intentional nohup/disown/setsid detach (a session/process-group/controlling-tty check, or an explicit opt-in signal the CLI sets when it deliberately backgrounds itself) versus the recorded launcher pid having actually exited. If a reliable distinction is not possible for some sub-case, downgrade ONLY that sub-case to documenting the constraint explicitly in `kazi apply --help` and the orchestrator recipe (~/.claude/skills/kazi/RECIPES.md) instead of silently reaping with an easy-to-miss warning -- do NOT weaken or remove the genuinely-dead-launcher reap path (#1073) to get there. WHAT NOT TO TOUCH: do not change `test/kazi/runtime/parent_monitor_test.exs`'s existing assertions -- add new coverage in a NEW file. TEST TO ADD: `test/kazi/runtime/parent_monitor_detach_test.exs`, using the module's existing injectable test seams (`:parent_pid`, `:alive_fn`, `:on_dead`, `:dead_threshold`, `:poll_ms`) plus real OS processes so the scenario is genuine, not simulated: (1) a test named exactly along the lines of 'a launcher reparented via nohup+disown survives as an intentional detach, not a reap' that spawns a real child process backgrounded via `nohup ... & disown` (or `setsid`), points a `ParentMonitor` at it, waits past `dead_threshold` polls, and asserts `on_dead` was NEVER invoked; (2) a test named along the lines of 'a genuinely killed launcher still triggers the reap (no #1073 regression)' that spawns a real child process, kills it for real, points a `ParentMonitor` at its pid, and asserts `on_dead` WAS invoked within the dead_threshold window. Both tests must actually assert on `on_dead` invocation (inject a stub `on_dead` that sends a message to the test process; do not just assert 'no crash'). PROCESS: branch `task/t70-4-parent-monitor-nohup-disown`, small conventional commits, push -u."
cmd = "sh"
args = ["-c", 'env -i HOME="$HOME" PATH="$PATH" LANG="$LANG" MIX_ENV=test TEST_SERVER=false mix test test/kazi/runtime/parent_monitor_detach_test.exs; true']
verdict = "match_count"
match_regex = "^[1-9][0-9]* tests?, 0 failures"
pass_when = ">= 1"
timeout_ms = 180000

