ecution internals. Do not add a `[scope].single_node` goal-file field. Do not touch T73.1/T73.2/T73.3/T73.4/T73.6 territory. TESTS (drive ALL 4 capability predicates from ONE new file): add `test/kazi/cli_single_node_test.exs` following the EXACT pattern of `test/kazi/cli_run_schedule_explain_test.exs` and `test/kazi/cli_run_parallel_worktree_isolation_test.exs` -- call `Kazi.CLI.run(args, inject_opts)` directly (NEVER shell out to the installed `kazi` binary), wrap in `ExUnit.CaptureIO.capture_io/1`, assert exit code + decode JSON. Tag: `@tag :single_node_fleet_refusal`. Checker: `mix test test/kazi/cli_single_node_test.exs --only single_node_fleet_refusal`."
